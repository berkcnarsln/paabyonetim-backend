worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    client_max_body_size 15m;

    upstream api {
        server api:3000;
    }

    # HTTP → HTTPS (tüm subdomainler dahil)
    server {
        listen 80;
        server_name paabyonetim.com www.paabyonetim.com *.paabyonetim.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # API — api.paabyonetim.com
    server {
        listen 443 ssl;
        server_name api.paabyonetim.com;

        ssl_certificate /etc/letsencrypt/live/api.paabyonetim.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.paabyonetim.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }

    # Ana domain + tüm tenant subdomainleri → aynı React uygulaması
    # Wildcard SSL sertifikası gerektirir: *.paabyonetim.com
    server {
        listen 443 ssl;
        server_name paabyonetim.com www.paabyonetim.com *.paabyonetim.com;

        ssl_certificate /etc/letsencrypt/live/paabyonetim.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/paabyonetim.com-0001/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /var/www/paabyonetim;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
